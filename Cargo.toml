[workspace]
resolver = "3"
members = [
    "hollyhock",
    "hollyhock-example",
    "hollyhock-macros",
    "hollyhock-sys",
]

[workspace.dependencies]
hollyhock = { path = "hollyhock" }
hollyhock-macros = { path = "hollyhock-macros" }
hollyhock-sys = { path = "hollyhock-sys" }

embedded-graphics = "0.8.2"
embedded-graphics-core = "0.4.1"
embedded-io = "0.7.1"
encoding_rs = { version = "0.8.44", default-features = false }
memchr = { version = "2.8.3", default-features = false }
quote = "1.0.47"
syn = "3.0.10"
tock-registers = "0.12.0"

[profile.dev]
panic = "abort"
opt-level = "s"

[profile.release]
panic = "abort"
opt-level = "s"
debug = true

[profile.hh3]
inherits = "release"
strip = true
