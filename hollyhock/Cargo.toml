[package]
name = "hollyhock"
version = "0.1.0"
edition = "2024"

[lib]
test = false
bench = false

[dependencies]
hollyhock-sys = { workspace = true }
hollyhock-macros = { workspace = true }

embedded-io = { workspace = true, features = ["alloc"] }
embedded-graphics-core = { workspace = true }
encoding_rs = { workspace = true, default-features = false }
memchr = { workspace = true, default-features = false }

[features]
default = ["panic-handler"]

heap-hack = []
big-app = ["heap-hack"]
big-app-1MB = ["heap-hack"]
big-app-4MB = ["heap-hack"]

panic-handler = []
